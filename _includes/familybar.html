<!-- The eJukebox family switcher. Same component as ejukebox.tv - only
     site.family.current differs. Keeps the parent one click from every page. -->
<nav class="fambar" aria-label="eJukebox sites">
  <div class="fambar__in">
    <img class="fambar__logo" src="{{ '/assets/ejukebox-logo.png' | relative_url }}"
         alt="eJukebox" width="58" height="29" decoding="async">
    <span class="fambar__label">Part of eJukebox</span>
    <div class="fambar__nav">
      <a class="is-parent" href="{{ site.family.parent }}">Main site &rarr;</a>
      <a href="{{ site.family.music }}"{% if site.family.current == 'music' %} class="is-here" aria-current="true"{% endif %}>Music</a>
      <a href="{{ site.family.tv }}"{% if site.family.current == 'tv' %} class="is-here" aria-current="true"{% endif %}>TV</a>
    </div>
  </div>
</nav>
